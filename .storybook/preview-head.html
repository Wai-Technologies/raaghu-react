<meta name="color-scheme" content="light dark" />
<style>
  :root {
    color-scheme: light dark;
  }
</style>
<script>
  (function () {
    function prefersDark() {
      var targets = [window];

      try {
        if (window.parent && window.parent !== window) targets.push(window.parent);
      } catch (e) {}

      try {
        if (window.top && window.top !== window) targets.push(window.top);
      } catch (e) {}

      for (var i = 0; i < targets.length; i++) {
        try {
          if (targets[i].matchMedia('(prefers-color-scheme: dark)').matches) {
            return true;
          }
        } catch (e) {}
      }

      return false;
    }

    function getGlobalsFromSearch(search) {
      try {
        var params = new URLSearchParams(search);
        return decodeURIComponent(params.get('globals') || '');
      } catch (e) {
        return '';
      }
    }

    /**
     * Manager URL is source of truth. System (default) clears theme from the
     * parent query while the iframe often keeps a stale theme:light|dark.
     */
    function getThemeMode() {
      try {
        var chain = [];
        var current = window;

        while (current) {
          try {
            void current.location.search;
            chain.push(current);
            if (current.parent === current) break;
            current = current.parent;
          } catch (e) {
            break;
          }
        }

        var manager = chain[chain.length - 1];
        var managerGlobals = getGlobalsFromSearch(manager.location.search);

        if (managerGlobals.indexOf('theme:dark') !== -1) return 'dark';
        if (managerGlobals.indexOf('theme:light') !== -1) return 'light';

        // theme:system, or no theme on manager while embedded → follow OS.
        if (
          managerGlobals.indexOf('theme:system') !== -1 ||
          chain.length > 1
        ) {
          return prefersDark() ? 'dark' : 'light';
        }

        // Standalone preview: fall back to own globals / OS.
        var selfGlobals = getGlobalsFromSearch(chain[0].location.search);
        if (selfGlobals.indexOf('theme:dark') !== -1) return 'dark';
        if (selfGlobals.indexOf('theme:light') !== -1) return 'light';
        return prefersDark() ? 'dark' : 'light';
      } catch (e) {
        return 'light';
      }
    }

    function applyTheme(mode) {
      var isDark = mode === 'dark';
      document.documentElement.setAttribute('data-theme', mode);
      document.documentElement.classList.toggle('rds-theme--dark', isDark);
      document.documentElement.classList.toggle('theme-dark', isDark);
      document.documentElement.classList.toggle('theme-light', !isDark);

      if (document.body) {
        document.body.classList.toggle('dark-theme', isDark);
        document.body.classList.toggle('theme-dark', isDark);
        document.body.classList.toggle('light-theme', !isDark);
        document.body.classList.toggle('theme-light', !isDark);
      }
    }

    function syncTheme() {
      applyTheme(getThemeMode());
    }

    syncTheme();

    [50, 150, 300, 600, 1200].forEach(function (delay) {
      window.setTimeout(syncTheme, delay);
    });

    window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', function () {
      syncTheme();
    });

    // Re-sync when the manager toolbar changes theme (parent URL updates without iframe reload).
    window.setInterval(syncTheme, 500);
  })();
</script>
