name: NPM Publish

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment:
      name: "Production"

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js version
        uses: actions/setup-node@v4
        with:
          node-version: "22.x"
          registry-url: 'https://registry.npmjs.org'
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps --ignore-scripts

      - name: Unit tests
        run: npm test -- --ci --maxWorkers=2

      - name: Build library (JS + declarations)
        run: npm run build

      - name: Strict declaration type-check
        run: npm run type-check:declarations

      - name: Publish to npm
        run: npm publish --access=public --ignore-scripts
        env:
          NODE_AUTH_TOKEN: ${{ secrets.STORYBOOK_NPM_TOKEN }}
