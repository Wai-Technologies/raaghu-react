name: Playwright Tests

on:
  pull_request:
    branches: [main, development, production]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # ── Functional coverage: renders all stories without runtime errors ──
  playwright-tests:
    name: Storybook Story Coverage
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm ci --legacy-peer-deps

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Build Storybook
        run: npm run build-storybook
        env:
          NODE_OPTIONS: '--max-old-space-size=4096'

      - name: Run story coverage tests
        run: npx playwright test tests/specs/elements tests/specs/components tests/specs/layouts tests/specs/appshell
        env:
          STORYBOOK_URL: http://127.0.0.1:6006

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

  # ── Visual regression: compares screenshots against committed baselines ──
  visual-regression:
    name: Visual Regression Smoke Test
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm ci --legacy-peer-deps

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Check baselines exist
        id: check-baselines
        run: |
          COUNT=$(find tests/snapshots -name "*.png" 2>/dev/null | wc -l)
          echo "count=$COUNT" >> "$GITHUB_OUTPUT"
          echo "Baseline snapshots found: $COUNT"

      - name: Build Storybook
        run: npm run build-storybook
        env:
          NODE_OPTIONS: '--max-old-space-size=4096'

      - name: Generate baselines (first run only)
        if: steps.check-baselines.outputs.count == '0'
        run: npm run test:visual:smoke -- --update-snapshots
        env:
          STORYBOOK_URL: http://127.0.0.1:6006

      - name: Run visual regression smoke tests
        if: steps.check-baselines.outputs.count != '0'
        run: npm run test:visual:smoke
        env:
          STORYBOOK_URL: http://127.0.0.1:6006

      - name: Run full visual regression (all Default stories)
        if: steps.check-baselines.outputs.count != '0'
        run: npx playwright test tests/specs/visual/branch-compare.spec.ts --grep "all Default" --timeout 300000
        env:
          STORYBOOK_URL: http://127.0.0.1:6006

      - name: Upload visual diff report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: visual-diff-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14
