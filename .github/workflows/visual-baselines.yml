name: Update Visual Baselines

# Run manually to regenerate baseline screenshots on Ubuntu
# (Linux baselines match the CI environment — always generate here, not locally)
on:
  workflow_dispatch:
    inputs:
      story_filter:
        description: 'Optional story title substring filter (leave blank for all smoke stories)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  update-baselines:
    name: Generate Baseline Screenshots (Ubuntu)
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm ci --legacy-peer-deps

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Build Storybook
        run: npm run build-storybook
        env:
          NODE_OPTIONS: '--max-old-space-size=4096'

      - name: Serve built Storybook
        run: npx http-server storybook-static -p 6006 --silent &
        shell: bash

      - name: Wait for Storybook
        run: npx wait-on http://127.0.0.1:6006 --timeout 60000

      - name: Update smoke test baselines
        run: |
          npx playwright test tests/specs/visual/branch-compare.spec.ts \
            --grep "smoke" \
            --update-snapshots
        env:
          STORYBOOK_URL: http://127.0.0.1:6006
          VR_STORY_FILTER: ${{ inputs.story_filter }}

      - name: Update all-Default-stories baselines
        run: |
          npx playwright test tests/specs/visual/branch-compare.spec.ts \
            --grep "all Default" \
            --update-snapshots \
            --timeout 300000
        env:
          STORYBOOK_URL: http://127.0.0.1:6006
          VR_STORY_FILTER: ${{ inputs.story_filter }}

      - name: Commit updated baselines
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add tests/snapshots/
          git diff --cached --quiet && echo "No snapshot changes" || \
            git commit -m "chore: update visual regression baselines [skip ci]"
          git push
