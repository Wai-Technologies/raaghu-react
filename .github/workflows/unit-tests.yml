name: Unit Tests

on:
  pull_request:
    branches: [main, development, production]
    paths:
      - 'raaghu-elements/**'
      - 'raaghu-components/**'
      - 'raaghu-layouts/**'
      - 'raaghu-react-themes/**'
      - 'utils/**'
      - 'tests/**'
      - 'jest.config.*'
      - 'package.json'
      - 'package-lock.json'
  push:
    branches: [development, production]
    paths:
      - 'raaghu-elements/**'
      - 'raaghu-components/**'
      - 'raaghu-layouts/**'
      - 'raaghu-react-themes/**'
      - 'utils/**'
      - 'tests/**'
      - 'jest.config.*'
      - 'package.json'
      - 'package-lock.json'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit-tests:
    name: Jest unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps --ignore-scripts

      - name: Run unit tests
        run: npm test -- --ci --maxWorkers=2
