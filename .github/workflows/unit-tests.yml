name: Unit Tests

on:
  push:
    branches: [main, development, production, development-react-v18, production-react-v18]
  pull_request:
    branches: [main, development, production, development-react-v18, production-react-v18]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit-tests:
    name: jest
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Run unit tests
        run: npm test -- --ci
